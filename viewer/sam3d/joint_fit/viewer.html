<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掌柄联合拟合 · 全片诊断</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e7eef5;font:15px/1.6 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{margin:0;font-size:26px}p{color:#aebdcb}.notice{padding:12px 16px;background:#293024;border-left:3px solid #d5b86b;border-radius:4px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.panel{background:#182431;border:1px solid #354658;border-radius:10px;padding:14px;min-width:0}.panel h2{font-size:16px;margin:0 0 10px}.stage{position:relative;aspect-ratio:16/9;background:#0b121b}.stage video{width:100%;height:100%}.stage canvas{position:absolute;inset:0;width:100%;height:100%}#space{position:static;width:100%;height:100%;touch-action:none}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,a.button{background:#31506a;border:1px solid #648198;border-radius:6px;padding:8px 14px;color:#fff;cursor:pointer;font:inherit}input[type=range]{flex:1;min-width:180px}button:focus-visible,input:focus-visible{outline:2px solid #73e1cc}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{padding:12px;background:#182431;border-radius:8px}.metric strong{display:block;font-size:23px}.muted{font-size:13px;color:#aebdcb}#status{min-height:50px;color:#e6c488}.cyan{color:#6ddcc9}.orange{color:#ffb974}a{color:#83d9e7}@media(max-width:850px){.panels{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style>
<main><h1>掌柄联合拟合 · 全片诊断</h1><p>自动使用整段观测，不使用手选关键帧。拖动右图可以旋转观察。</p><div class="notice">当前仅更新球拍与手部关节，尚未更新人体手部网格。接触距离是几何约束残差，不是真实握法准确率；遮挡手指仍是推断。</div>
<div class="metrics" id="summary"></div><div class="panels"><section class="panel"><h2>视频投影 · <span class="cyan">球拍</span> / <span class="orange">手部关节</span></h2><div class="stage"><video id="video" src="../video.mp4" preload="auto" muted playsinline></video><canvas id="overlay" width="1280" height="720"></canvas></div></section><section class="panel"><h2>三维接触诊断 · 关节示意</h2><div class="stage"><canvas id="space" width="900" height="506" aria-label="可拖动旋转的手部与球拍三维关节示意"></canvas></div></section></div>
<div class="controls"><button id="play">播放</button><button id="prev">上一帧</button><input id="seek" type="range" min="0" max="249" value="0" aria-label="视频帧"><button id="next">下一帧</button><span id="frame"></span><label><input id="initial" type="checkbox">叠加初始估计</label><button id="review">下一待复核帧</button></div><div id="status" role="status"></div><div class="metrics" id="measures"></div><p class="muted">灰色虚线为初始估计。低观测权重表示证据较弱，不是概率。原视频与推理帧的对应关系仍包含估计误差。</p><a href="../viewer.html">返回原 Viewer</a> · <a href="report.json">全片报告</a></main>
<script>
'use strict';
const $=id=>document.getElementById(id),video=$('video'),ctx=$('overlay').getContext('2d'),space=$('space'),sx=space.getContext('2d');let data,n=0,yaw=-.6,pitch=.6,drag=null;
const chains=[0,4,8,12,16].map(t=>[20,t+3,t+2,t+1,t]);
const words={missing_racket_observation:'缺少球拍观测',contour_mismatch:'轮廓不贴合',grasp_unknown:'握持状态未知',contact_unresolved:'接触未解决',bone_length_change:'骨长变化偏大',rotation_jump:'姿态跳变',uncertain_frame_mapping:'帧对应不确定',weak_hand_evidence:'手部观测较弱',large_inferred_hand_change:'手指推断位移较大'};
function line(c,points,color,width=2,close=false){if(!points.length)return;c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));if(close)c.closePath();c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function hand(c,p,color){for(const chain of chains)line(c,chain.map(i=>p[i]),color,2);c.fillStyle=color;for(const q of p){c.beginPath();c.arc(...q,2.5,0,Math.PI*2);c.fill()}}
const mul=(R,p)=>R.map(r=>r.reduce((s,x,i)=>s+x*p[i],0));
function render(){if(!data)return;const r=data.frames[n];ctx.clearRect(0,0,1280,720);if($('initial').checked){ctx.setLineDash([6,5]);line(ctx,r.ring_initial_image,'#a8abb1',2,true);hand(ctx,r.hand_initial_image,'#a8abb1');ctx.setLineDash([])}line(ctx,r.ring_image,'#6ddcc9',3,true);hand(ctx,r.hand_image,'#ffb974');
const m=data.model,R=r.rotation_camera_columns,g=r.grip_camera_m,world=p=>mul(R,[p[0],p[1]-m.grip_y_m,p[2]]).map((x,i)=>x+g[i]);const ring=m.head_outline.map(world),wrist=r.joints_camera[41],center=wrist.map((x,i)=>(x+ring.reduce((s,p)=>s+p[i],0)/ring.length)/2);
function project(p){let [x,y,z]=p.map((v,i)=>v-center[i]);const xx=x*Math.cos(yaw)+z*Math.sin(yaw),zz=-x*Math.sin(yaw)+z*Math.cos(yaw);return[450+xx*660,253+(y*Math.cos(pitch)-zz*Math.sin(pitch))*660]}
sx.clearRect(0,0,900,506);sx.fillStyle='#111d28';sx.fillRect(0,0,900,506);sx.strokeStyle='#263c4e';sx.lineWidth=1;for(let x=0;x<900;x+=60){sx.beginPath();sx.moveTo(x,0);sx.lineTo(x,506);sx.stroke()}for(let y=0;y<506;y+=60){sx.beginPath();sx.moveTo(0,y);sx.lineTo(900,y);sx.stroke()}
line(sx,ring.map(project),'#6ddcc9',3,true);line(sx,[[0,0,0],[0,m.throat_y_m,0]].map(world).map(project),'#e7eef5',8);line(sx,[r.joints_camera[8],wrist].map(project),'#7c8e9f',8);if($('initial').checked){sx.setLineDash([5,5]);hand(sx,r.hand_initial_camera.map(project),'#8b949e');sx.setLineDash([])}hand(sx,r.joints_camera.slice(21,42).map(project),'#ffb974');
$('frame').textContent=`第 ${n+1} / ${data.frames.length} 帧 · ${r.time.toFixed(2)} 秒`;$('seek').value=n;$('status').textContent=r.review_reasons.length?'待复核：'+r.review_reasons.map(x=>words[x]||x).join('、'):'未触发当前筛选阈值；仍不代表真实姿态已验证';const ms=r.metrics;$('measures').innerHTML=[['轮廓残差',ms.contour_rms_px.toFixed(1)+' px'],['接触约束残差',ms.contact_proxy_mm.toFixed(1)+' mm'],['最大骨长变化',r.bone_length_change_mm.toFixed(2)+' mm'],['手部观测权重',r.hand_weight.toFixed(2)]].map(([k,v])=>`<div class="metric">${k}<strong>${v}</strong></div>`).join('')}
function seek(i){if(!data)return;n=Math.max(0,Math.min(data.frames.length-1,i));video.currentTime=data.frames[n].time;render()}
$('seek').oninput=e=>seek(+e.target.value);$('prev').onclick=()=>seek(n-1);$('next').onclick=()=>seek(n+1);$('initial').onchange=render;$('play').onclick=()=>video.paused?video.play().catch(e=>$('status').textContent=e.message):video.pause();video.onplay=()=>$('play').textContent='暂停';video.onpause=()=>$('play').textContent='播放';video.onseeked=render;
function tick(){if(data){n=data.frames.reduce((best,r,i)=>Math.abs(r.time-video.currentTime)<Math.abs(data.frames[best].time-video.currentTime)?i:best,0);render()}video.requestVideoFrameCallback(tick)}if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(tick);else video.ontimeupdate=()=>{if(data){n=data.frames.findLastIndex(r=>r.time<=video.currentTime);n=Math.max(n,0);render()}};
$('review').onclick=()=>{if(!data)return;const found=data.frames.findIndex((r,i)=>i>n&&r.review_reasons.length);seek(found>=0?found:data.frames.findIndex(r=>r.review_reasons.length))};space.onpointerdown=e=>{drag=[e.clientX,e.clientY];space.setPointerCapture(e.pointerId)};space.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];render()};space.onpointerup=space.onpointercancel=()=>drag=null;
fetch('viewer_data.json').then(r=>{if(!r.ok)throw Error('诊断数据下载失败');return r.json()}).then(d=>{data=d;$('seek').max=d.frames.length-1;const s=d.summary;$('summary').innerHTML=[['全片处理',s.frames+' 帧'],['手选关键帧','0 帧'],['接触未解决',s.contact_unresolved_frames+' 帧'],['待复核',s.review_frames+' 帧']].map(([k,v])=>`<div class="metric">${k}<strong>${v}</strong></div>`).join('');render()}).catch(e=>$('status').textContent=e.message);
</script></html>
