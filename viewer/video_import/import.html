<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频导入与生成</title>
<style>body{max-width:960px;margin:32px auto;padding:0 20px;background:#101824;color:#e6eef8;font:16px system-ui}a{color:#8ecfff}button,input{font:inherit;padding:10px;background:#27425c;color:white;border:1px solid #536d86;border-radius:8px}button{cursor:pointer}button:disabled{opacity:.5}article,section{background:#192638;border:1px solid #34475d;padding:20px;border-radius:12px;margin:16px 0}video{width:100%;max-height:300px;margin:12px 0}p{line-height:1.6}small{color:#b5c7da}.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}</style>
<h1>视频导入与生成</h1><a href="/default/viewer.html">打开默认视频</a>
<section><h2>导入新视频</h2><p>默认视频保持不变。新视频独立保存，生成对应的人体网格和人物遮罩。</p><input id="file" type="file" accept="video/*" aria-label="选择视频"><button id="upload">导入视频</button><p><small>支持 MP4、MOV 等常见格式，最长 120 秒、最大 1 GB。导入后统一转换为 25 帧/秒并移除音轨，供预览和生成使用。</small></p><p id="status" role="status"></p><p id="engine"></p></section>
<h2>已导入视频</h2><div id="items"></div>
<script>
const $=id=>document.getElementById(id);let busy=false,last='';
async function api(path,options){const r=await fetch(path,options),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function refresh(){try{const data=await api('/api/videos');$('engine').textContent=data.generation_available?'人体生成服务已配置':'人体生成服务尚未配置。可以先导入、预览视频；配置后再点击生成。';const signature=JSON.stringify(data);if(signature===last)return;last=signature;$('items').replaceChildren();for(const item of data.videos){const card=document.createElement('article'),title=document.createElement('h3'),state=document.createElement('p'),video=document.createElement('video'),actions=document.createElement('div');title.textContent=item.name;state.textContent=item.message;video.src=item.preview;video.controls=true;video.preload='metadata';actions.className='actions';const button=document.createElement('button');button.textContent=item.status==='failed'?'重新生成':'生成人体';button.disabled=!data.generation_available||['queued','generating','ready'].includes(item.status);button.onclick=async()=>{button.disabled=true;try{await api('/api/videos/'+item.id+'/generate',{method:'POST'});last='';await refresh()}catch(e){$('status').textContent=e.message;button.disabled=false}};actions.append(button);if(item.status==='ready'){const link=document.createElement('a');link.href=item.viewer;link.textContent='打开三维结果';actions.append(link)}card.append(title,state,video,actions);$('items').append(card)}}catch(e){$('status').textContent='无法连接本地视频服务：'+e.message}}
$('upload').onclick=async()=>{const file=$('file').files[0];if(!file||busy)return;if(file.size>1024**3){$('status').textContent='视频不能超过 1 GB';return}busy=true;$('upload').disabled=true;$('status').textContent='正在上传并转换视频，请稍候…';try{await api('/api/videos?name='+encodeURIComponent(file.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});$('status').textContent='导入完成';$('file').value='';await refresh()}catch(e){$('status').textContent=e.message}finally{busy=false;$('upload').disabled=false}};
refresh();setInterval(()=>{if(!busy&&!document.hidden)refresh()},3000);
</script></html>
