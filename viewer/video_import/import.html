<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频导入与生成</title>
<style>
:root{color-scheme:dark;--bg:#080e17;--panel:#101c2b;--line:#24364a;--muted:#96a9bf;--cyan:#6ce5db}*{box-sizing:border-box}body{max-width:1240px;margin:0 auto;padding:32px clamp(18px,4vw,56px);background:radial-gradient(ellipse at 85% 0,#12374466,transparent 50%),var(--bg);color:#edf5ff;font:15px system-ui}a{color:inherit;text-decoration:none}button,input{font:inherit}button,a.button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#1a2b3f;color:#eff9ff;padding:12px 18px;display:inline-flex;gap:10px;align-items:center;justify-content:center;min-height:44px;transition:background .16s,transform .16s}button:hover,a.button:hover{background:#284158;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed;transform:none}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}.primary{background:var(--cyan)!important;color:#052725!important;border-color:var(--cyan)!important;font-weight:700}svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:2px;font-size:13px}.brand-icon{display:grid;place-items:center;width:38px;height:38px;background:#123b42;border:1px solid #2c747b;border-radius:11px;color:var(--cyan)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}.tag{font-size:11px;letter-spacing:2px;color:var(--cyan)}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}h1{font-size:clamp(30px,4vw,48px);letter-spacing:-1.5px;margin:10px 0}h2{font-size:18px;margin:0}p{line-height:1.65}.muted,small{color:var(--muted)}.hero p{margin:0;color:var(--muted)}.flow{display:flex;align-items:center;gap:8px;list-style:none;padding:0;margin:26px 0 30px}.flow li{display:flex;align-items:center;gap:10px;color:var(--muted);flex:1;font-size:13px}.flow li:not(:last-child):after{content:'';height:1px;flex:1;background:var(--line);margin:0 12px}.step{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#142132}.flow li:first-child{color:var(--cyan)}.flow li:first-child .step{border-color:#409e9c;background:#103638}.workspace{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.upload-card,.sample,article{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#142233dd,#0d1724ee);padding:24px}.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:206px;margin:20px 0;border:1px dashed #3b5b71;border-radius:12px;background:#10233360;cursor:pointer;gap:12px}.drop:hover,.drop:focus-within{border-color:var(--cyan);background:#12313c}.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.drop .upload-icon{width:48px;height:48px;padding:12px;background:#16404a;color:var(--cyan);border-radius:14px}.drop strong{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 16px}.drop small{font-size:12px}.upload-bottom{display:flex;gap:12px;align-items:center;justify-content:space-between}.status:empty{display:none}.status{color:#ffd391;font-size:13px;margin:14px 0 0}.sample{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:340px}.sample-visual{position:relative;display:grid;place-items:center;height:210px;background:radial-gradient(ellipse,#236b783d,transparent 65%)}.sample-visual:before{content:'';position:absolute;inset:25px 0;background-image:linear-gradient(#66ced51a 1px,transparent 1px),linear-gradient(90deg,#66ced51a 1px,transparent 1px);background-size:26px 26px;transform:perspective(250px) rotateX(40deg);mask-image:radial-gradient(ellipse,black,transparent 75%)}.sample-visual svg{width:142px;height:160px;color:var(--cyan);stroke-width:1;filter:drop-shadow(0 0 14px #55caca70);position:relative}.sample-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.sample-bottom p{margin:6px 0 0;font-size:12px;color:var(--muted)}.section-head{margin:38px 0 16px;display:flex;justify-content:space-between;align-items:center}.engine{font-size:12px;color:#ffd391;border:1px solid #6c55373d;background:#4c371d38;padding:7px 12px;border-radius:30px}.engine.ready{color:var(--cyan);background:#153d36}#items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article h3{margin:0;font-size:16px;overflow-wrap:anywhere}article p{color:var(--muted);font-size:13px}video{width:100%;max-height:260px;background:#060b11;border-radius:10px;margin:10px 0}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.actions a{color:var(--cyan)}.empty{grid-column:1/-1;padding:36px;text-align:center;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px}details{margin-top:22px;font-size:12px;color:var(--muted)}summary{cursor:pointer}footer{margin:36px 0 0;border-top:1px solid var(--line);padding-top:20px;color:#71889f;font-size:11px;letter-spacing:1px}@media(max-width:720px){body{padding:22px 18px}header{margin-bottom:30px}.workspace{grid-template-columns:1fr}.flow li{gap:6px;font-size:12px}.flow li:not(:last-child):after{margin:0 4px}.step{width:30px;height:30px}.hero{align-items:start}.hero .tag{display:none}#items{grid-template-columns:1fr}.section-head{gap:10px;flex-wrap:wrap}.sample{min-height:260px}.sample-visual{height:140px}}
</style>
<header><div class="brand"><span class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7Z M3 7l9 5 9-5M12 12v10"/></svg></span>HEHAA <span class="muted">/ MOTION LAB</span></div><span class="tag">3D TENNIS</span></header>
<div class="hero"><div><span class="tag">VIDEO WORKSPACE</span><h1>让动作，清晰可见。</h1><p>视频 · 三维重建 · 动作指导</p></div></div>
<ol class="flow" aria-label="处理流程"><li><span class="step">↑</span>导入</li><li><span class="step">◇</span>生成</li><li><span class="step">▷</span>查看</li><li><span class="step">◎</span>教学</li></ol>
<div class="workspace"><section class="upload-card"><h2>新建分析</h2><label class="drop"><span class="upload-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg></span><strong id="filename">选择视频文件</strong><small>MP4 / MOV · ≤ 120 秒 · ≤ 1 GB</small><input id="file" type="file" accept="video/*" aria-label="选择视频"></label><div class="upload-bottom"><small>独立保存，保留默认视频</small><button id="upload" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg>导入</button></div><p id="status" class="status" role="status"></p></section>
<section class="sample"><span class="tag">DEMO / 默认视频</span><div class="sample-visual" aria-hidden="true"><svg viewBox="0 0 140 170"><circle cx="70" cy="22" r="10"/><path d="m70 32-4 40 18 33-4 49M66 72 47 106l-15 44M68 45 43 61 22 48M68 45l27 14 15-21M43 61l23 11 29-13M47 106l37-1"/><ellipse cx="115" cy="25" rx="12" ry="18" transform="rotate(25 115 25)"/><path d="m107 41-6 14"/><g fill="currentColor"><circle cx="66" cy="72" r="3"/><circle cx="47" cy="106" r="3"/><circle cx="84" cy="105" r="3"/><circle cx="43" cy="61" r="3"/><circle cx="95" cy="59" r="3"/></g></svg></div><div class="sample-bottom"><div><h2>网球动作样例</h2><p>人体 + 球拍 + 教学草稿</p></div><a class="button" href="/default/viewer.html" aria-label="打开默认视频"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg>打开</a></div></section></div>
<div class="section-head"><h2>我的视频 <small id="count">0</small></h2><span id="engine" class="engine" role="status"></span></div><div id="items"></div>
<details><summary>导入说明</summary><p>视频统一转换为 25 帧/秒并移除音轨，用于预览和生成。真实生成人体需要配置模型服务。没有对应分析时，教学页显示待分析状态。</p></details><footer>HEHAA MOTION LAB <span style="float:right">LOCAL WORKSPACE</span></footer>
<script>
const $=id=>document.getElementById(id);let busy=false,last='';
async function api(path,options){const r=await fetch(path,options),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function refresh(){try{const data=await api('/api/videos');$('engine').textContent=data.generation_available?'● 生成服务就绪':'○ 生成服务待配置';$('engine').classList.toggle('ready',data.generation_available);$('engine').title=data.generation_available?'可生成人体网格':'可先导入与预览，配置模型后生成';$('count').textContent=data.videos.length;const signature=JSON.stringify(data);if(signature===last)return;last=signature;$('items').replaceChildren();if(!data.videos.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无视频 · 导入第一段动作，或先体验默认样例';$('items').append(empty)}for(const item of data.videos){const card=document.createElement('article'),title=document.createElement('h3'),state=document.createElement('p'),video=document.createElement('video'),actions=document.createElement('div');title.textContent=item.name;state.textContent=item.message;video.src=item.preview;video.controls=true;video.preload='metadata';actions.className='actions';const button=document.createElement('button');button.textContent=item.status==='failed'?'重新生成':'生成人体';button.disabled=!data.generation_available||['queued','generating','ready'].includes(item.status);button.onclick=async()=>{button.disabled=true;try{await api('/api/videos/'+item.id+'/generate',{method:'POST'});last='';await refresh()}catch(e){$('status').textContent=e.message;button.disabled=false}};actions.append(button);if(item.status==='ready'){const link=document.createElement('a');link.href=item.viewer;link.textContent='打开三维结果';actions.append(link)}card.append(title,state,video,actions);$('items').append(card)}}catch(e){$('status').textContent='无法连接本地视频服务：'+e.message}}
$('file').onchange=()=>{$('filename').textContent=$('file').files[0]?.name||'选择视频文件'};
$('upload').onclick=async()=>{const file=$('file').files[0];if(!file||busy)return;if(file.size>1024**3){$('status').textContent='视频不能超过 1 GB';return}busy=true;$('upload').disabled=true;$('status').textContent='正在上传并转换视频，请稍候…';try{await api('/api/videos?name='+encodeURIComponent(file.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});$('status').textContent='导入完成';$('file').value='';$('filename').textContent='选择视频文件';await refresh()}catch(e){$('status').textContent=e.message}finally{busy=false;$('upload').disabled=false}};
refresh();setInterval(()=>{if(!busy&&!document.hidden)refresh()},3000);
</script></html>
