<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联合拟合 · 新验证帧标注</title><style>body{margin:24px;background:#101824;color:#e6eef8;font:15px system-ui}button,select{padding:9px;margin:4px;background:#1d3548;color:inherit;border:1px solid #496078;border-radius:8px}a{color:#6ce5db}.viewport{overflow:auto;max-height:70vh;border:1px solid #496078}canvas{display:block;width:100%;cursor:crosshair}canvas.zoom{width:2560px}#status{color:#6ce5db}</style><h1>联合拟合 · 新验证帧标注</h1><p>6 帧已在当前 A/B 实验中排除训练观测。标注前不显示拟合结果或旧自动点；只标记清晰可见部位，遮挡端点保持空缺。此前实验用过这些帧的自动点，因此它们不是完全未见数据。</p><nav><button id="previous">上一帧</button><select id="frames" aria-label="验证帧"></select><button id="next">下一帧</button><select id="view" aria-label="角色"><option value="points">真人</option><option value="mirror_points">镜中</option></select><select id="part" aria-label="关键点"><option value="handle_end">可见柄底</option><option value="throat">线床下缘中心</option><option value="grip_center">握点（包握区域轴心）</option><option value="tip">拍尖</option><option value="rim_side">拍框一侧（未确认物理侧）</option><option value="rim_opposite">拍框另一侧</option></select><button id="zoom">原像素放大</button><button id="remove">删除当前点</button><button id="review">确认本帧已检查</button><button id="export">导出已检查标注</button></nav><label><input id="gripConfirmed" type="checkbox">当前观测握点清晰可见，已确认</label><p id="status" role="status">加载中</p><div class="viewport"><canvas id="image" aria-label="原始验证帧"></canvas></div><pre id="coordinates"></pre><p>绿色为真人标注，蓝色为镜中标注。帧号以零起始写入 JSON。导出不会写入主 Viewer 或启动拟合；拍面物理 A/B 保持未确认。</p><script>
const $=id=>document.getElementById(id);let packet,index=0,img=new Image(),loadVersion=0;const canvas=$('image'),ctx=canvas.getContext('2d');
function render(){ctx.drawImage(img,0,0);const row=packet.frames[index];for(const view of ['points','mirror_points']){ctx.fillStyle=view==='points'?'#25ea79':'#00caff';ctx.strokeStyle=ctx.fillStyle;for(const [name,p] of Object.entries(row[view])){ctx.beginPath();ctx.arc(p[0],p[1],7,0,Math.PI*2);ctx.stroke();ctx.font='20px system-ui';ctx.fillText(name,p[0]+10,p[1]-10)}}$('gripConfirmed').disabled=!row[$('view').value].grip_center;$('gripConfirmed').checked=!!row.grip_confirmed?.[$('view').value];$('coordinates').textContent=JSON.stringify({frame:row.frame,points:row.points,mirror_points:row.mirror_points},null,2);$('status').textContent=`界面第 ${row.frame+1} 帧 · 零基 ${row.frame} · ${(row.frame/packet.fps).toFixed(2)} 秒 · ${row.review_status}`}
async function show(){const version=++loadVersion;canvas.style.pointerEvents='none';index=+$('frames').value;const image=new Image();image.src=packet.frames[index].source_frame_png;await image.decode();if(version!==loadVersion)return;img=image;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;render();canvas.style.pointerEvents='auto';$('previous').disabled=index===0;$('next').disabled=index===packet.frames.length-1}
canvas.onclick=e=>{if(!packet||!img.complete)return;const r=canvas.getBoundingClientRect();packet.frames[index][$('view').value][$('part').value]=[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];if($('part').value==='grip_center'){packet.frames[index].grip_confirmed??={};packet.frames[index].grip_confirmed[$('view').value]=false}packet.frames[index].review_status='pending';render()};
$('view').onchange=render;$('gripConfirmed').onchange=e=>{packet.frames[index].grip_confirmed??={};packet.frames[index].grip_confirmed[$('view').value]=e.target.checked;packet.frames[index].review_status='pending';render()};$('frames').onchange=()=>show().catch(e=>$('status').textContent=e.message);for(const [id,delta] of [['previous',-1],['next',1]])$(id).onclick=()=>{$('frames').value=index+delta;show().catch(e=>$('status').textContent=e.message)};
$('zoom').onclick=()=>canvas.classList.toggle('zoom');$('remove').onclick=()=>{delete packet.frames[index][$('view').value][$('part').value];if($('part').value==='grip_center'){packet.frames[index].grip_confirmed??={};packet.frames[index].grip_confirmed[$('view').value]=false}packet.frames[index].review_status='pending';render()};$('review').onclick=()=>{packet.frames[index].review_status='manually_reviewed';render()};
$('export').onclick=()=>{const frames=packet.frames.filter(r=>r.review_status==='manually_reviewed').map(r=>({frame:r.frame,source:'manual_review',points:r.points,mirror_points:r.mirror_points,grip_confirmed:r.grip_confirmed||{},face_correspondence_confirmed:false,side_feature:''}));if(!frames.length){$('status').textContent='请先检查并确认至少一帧';return}const value={schema_version:1,video_sha256:packet.video_sha256,image_size:packet.image_size,fps:packet.fps,coordinate_system:'source_video_pixels',frames};const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='reserved_validation_landmarks.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
(async()=>{const r=await fetch('annotation_template.json');if(!r.ok)throw Error('标注包加载失败');packet=await r.json();for(const [i,row] of packet.frames.entries()){const o=document.createElement('option');o.value=i;o.textContent=`${i+1}/${packet.frames.length} · 界面 ${row.frame+1} 帧`;$('frames').append(o)}await show()})().catch(e=>$('status').textContent=e.message);
</script></html>
