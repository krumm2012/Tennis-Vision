<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新视频 · SAM 人体</title><style>body{background:#101824;color:#e6eef8;font:16px system-ui;margin:24px}a{color:#8ecfff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{position:relative;aspect-ratio:16/9;background:#192638}video,canvas{width:100%;height:100%;display:block}canvas{touch-action:none}button,input{font:inherit;padding:8px;margin:4px}nav{margin:12px 0}#seek{width:40%}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style>
<h1>新视频 · 三维人体</h1><p><a href="/import.html">返回视频库</a> · <a href="/default/viewer.html">默认视频</a></p><p>当前结果仅包含本视频的人体与遮罩。未提供镜面标定、球拍或实测地面；不可见表面保留灰色。</p>
<nav><button id="play" disabled>播放</button><button id="front">正面</button><button id="back">背面</button><input id="seek" aria-label="视频时间轴" type="range" min="0" value="0"><span id="status" role="status">加载中</span></nav><div class="grid"><div class="box"><video id="video" src="video.mp4" playsinline preload="auto"></video></div><div class="box"><canvas id="mesh"></canvas></div></div>
<script src="/assets/vendor/three-0.180.0.min.js"></script><script src="/assets/mesh_renderer.js"></script><script>
const $=id=>document.getElementById(id),video=$('video'),canvas=$('mesh');let renderer,frame=0,yaw=.2,pitch=.1,zoom=1,drag=null,wantsPlay=false,error=false;
function fail(e){error=true;wantsPlay=false;video.pause();$('status').textContent=e.message+'；刷新页面重试';$('play').disabled=true}
function draw(){if(!renderer?.ready||video.seeking||error)return;const meta=renderer.meta,rect=canvas.getBoundingClientRect(),center=meta.display_centers[frame],span=Math.max(meta.display_spans[frame],.1);const scale=Math.min(rect.width,rect.height)*.8/span*zoom;const ok=renderer.draw(frame,'raw',[[1,0,0],[0,-1,0],[0,0,-1]],[-center[0],center[1],center[2]],[0,0,0],[yaw,pitch],scale,rect,true,false,true);$('seek').value=frame;$('status').textContent=ok?`${(frame/meta.fps).toFixed(2)} 秒 · ${frame+1}/${meta.frames} 帧`:'正在缓冲网格…';$('play').disabled=!ok&&!wantsPlay;if(!ok)video.pause();else if(wantsPlay&&video.paused)video.play().catch(fail)}
function pause(){wantsPlay=false;video.pause();$('play').textContent='播放'}
$('play').onclick=()=>{if(wantsPlay)pause();else{wantsPlay=true;$('play').textContent='暂停';draw()}};
$('seek').oninput=e=>{pause();frame=+e.target.value;video.currentTime=frame/renderer.meta.fps;if(!video.seeking)draw()};video.onseeked=()=>{if(renderer?.ready){frame=Math.min(renderer.meta.frames-1,Math.round(video.currentTime*renderer.meta.fps));draw()}};video.onloadeddata=draw;video.onended=pause;
function tick(_,metadata){if(renderer?.ready&&!video.paused){frame=Math.min(renderer.meta.frames-1,Math.round((metadata?.mediaTime??video.currentTime)*renderer.meta.fps));draw()}if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(tick);else requestAnimationFrame(tick)}tick();
$('front').onclick=()=>{yaw=0;draw()};$('back').onclick=()=>{yaw=Math.PI;draw()};canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.01;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];draw()}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom-e.deltaY*.001));draw()},{passive:false});window.onresize=draw;
try{renderer=new SamMeshRenderer(canvas,video);renderer.onFrameReady=n=>{if(n===frame)draw()};renderer.onError=(e,n)=>{if(n===frame)fail(e)};renderer.load().then(()=>{$('seek').max=renderer.meta.frames-1;draw()}).catch(fail)}catch(e){fail(e)}
</script><script src="/assets/coaching.js"></script><script>TennisCoaching.mount({container:document.body,video,seek:time=>{pause();frame=Math.min(renderer.meta.frames-1,Math.round(time*renderer.meta.fps));video.currentTime=frame/renderer.meta.fps;if(!video.seeking)draw()}});</script></html>
