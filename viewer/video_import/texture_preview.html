<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHR · 纹理合成候选</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(ellipse at 70% 0,#133543,#080e17 65%);color:#e8f3fa;font:15px system-ui;max-width:1500px;margin:auto}h1{font-size:22px}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:#132231;border:1px solid #2d475b;border-radius:14px}button,select{background:#1b3448;color:#e8f3fa;border:1px solid #38596e;border-radius:8px;padding:9px;cursor:pointer}button[aria-pressed=true]{background:#63e1d1;color:#092b2c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}.box{aspect-ratio:16/10;border:1px solid #2d475b;border-radius:16px;overflow:hidden;background:#122536;position:relative}canvas,video{width:100%;height:100%;display:block}video{object-fit:contain}#model{touch-action:none}.hint{font-size:12px;color:#9fb8c9}.badge{position:absolute;bottom:12px;left:14px;color:#9fb8c9;font-size:12px}#seek{flex:1;min-width:140px;accent-color:#63e1d1}a{color:#63e1d1}details{background:#132231;padding:16px;border:1px solid #2d475b;border-radius:14px}#atlasImage{max-width:100%;max-height:400px}summary{cursor:pointer}@media(max-width:800px){body{padding:16px}.grid{grid-template-columns:1fr}}
</style><h1>◈ 人体表面纹理</h1><p class="hint">候选 · 真实画面合成 · 灰色为无观测表面 · 拖动旋转 / 滚轮缩放</p><nav><button id="play">播放</button><select id="appearance" aria-label="纹理版本"><option value="body_texture_rgba.png">多视频合成</option><option value="body_texture_baseline.png">单视频基线</option><option value="neutral">灰模</option></select><button id="front">正面</button><button id="back">背面</button><button id="left">左侧</button><button id="right">右侧</button><input id="seek" aria-label="视频时间轴" type="range" min="0" value="0"><span id="status" role="status">加载中</span></nav><div class="grid"><div class="box"><video id="video" src="video.mp4" preload="auto" playsinline></video></div><div class="box"><canvas id="model" aria-label="UV 人体纹理预览"></canvas><span class="badge">共享 MHR UV · 姿态仍为单目估计</span></div></div><p id="report" class="hint" role="status"></p><details><summary>▧ UV 图与来源</summary><p class="hint">UV 分辨率不等于原始细节分辨率。未知表面保持透明；跨姿态衣物滑动、阴影和接缝仍需检查。</p><img id="atlasImage" src="body_texture_rgba.png" alt="MHR UV 人体纹理图"><p><a href="body_texture_rgba.png">纹理 PNG</a> · <a href="texture_report.json">合成报告</a> · <a href="/import.html">视频库</a></p></details><script src="/assets/vendor/three-0.180.0.min.js"></script><script>
const $=id=>document.getElementById(id),video=$('video'),canvas=$('model');let scene,camera,gl,mesh,meta,raw,mapping,frame=0,yaw=0,pitch=.12,zoom=1,drag=null,ready=false;const textures=new Map();
async function buffer(name,Type){const r=await fetch(name);if(!r.ok)throw Error(name+' 加载失败');return new Type(await r.arrayBuffer())}
async function texture(name){if(!textures.has(name)){const image=new Image();image.src=name;await image.decode();const t=new THREE.Texture(image);t.flipY=true;t.colorSpace=THREE.NoColorSpace;t.needsUpdate=true;textures.set(name,t)}return textures.get(name)}
function draw(){if(!ready)return;frame=Math.min(meta.frames-1,Math.round(video.currentTime*meta.fps));const attr=mesh.geometry.getAttribute('position'),base=frame*meta.vertices*3;for(let k=0;k<mapping.length;k++){const a=base+mapping[k]*3;attr.array[k*3]=raw[a];attr.array[k*3+1]=-raw[a+1];attr.array[k*3+2]=-raw[a+2]}attr.needsUpdate=true;const center=meta.display_centers[frame],span=Math.max(meta.display_spans[frame],.1),rect=canvas.getBoundingClientRect();gl.setSize(rect.width,rect.height,false);const aspect=rect.width/rect.height;camera.left=-span*aspect*.65/zoom;camera.right=-camera.left;camera.top=span*.65/zoom;camera.bottom=-camera.top;camera.position.set(Math.sin(yaw)*Math.cos(pitch)*6,Math.sin(pitch)*6,Math.cos(yaw)*Math.cos(pitch)*6);camera.lookAt(0,0,0);camera.updateProjectionMatrix();mesh.position.set(-center[0],center[1],center[2]);gl.render(scene,camera);$('seek').value=frame;$('status').textContent=`${(frame/meta.fps).toFixed(2)} 秒 · ${frame+1}/${meta.frames} 帧`}
$('play').onclick=async()=>{if(!ready)return;if(video.paused){if(video.ended)video.currentTime=0;await video.play();$('play').textContent='暂停'}else{video.pause();$('play').textContent='播放'}};video.onended=()=>{$('play').textContent='播放'};$('seek').oninput=()=>{video.pause();$('play').textContent='播放';video.currentTime=+$('seek').value/meta.fps};video.onseeked=draw;
for(const [id,angle] of [['front',0],['back',Math.PI],['left',Math.PI/2],['right',-Math.PI/2]])$(id).onclick=()=>{yaw=angle;pitch=.12;draw()};$('appearance').onchange=async()=>{try{const value=$('appearance').value;mesh.material.uniforms.neutral.value=value==='neutral';if(value!=='neutral')mesh.material.uniforms.atlas.value=await texture(value);draw()}catch(e){$('report').textContent=e.message}};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(4,zoom-e.deltaY*.001));draw()},{passive:false});window.onresize=draw;
function tick(){if(ready&&!video.paused)draw();if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(tick);else requestAnimationFrame(tick)}
(async()=>{meta=await fetch('mesh_meta.json').then(r=>r.json());const report=await fetch('texture_report.json').then(r=>r.json());[raw,mapping]=await Promise.all([buffer('mesh_local.bin',Float32Array),buffer('appearance_map.bin',Uint32Array)]);const [uv,indices]=await Promise.all([buffer('appearance_uv.bin',Float32Array),buffer('appearance_indices.bin',Uint32Array)]);if(raw.length!==meta.frames*meta.vertices*3||mapping.some(i=>i>=meta.vertices)||uv.length!==mapping.length*2)throw Error('UV 纹理与姿态拓扑不一致');scene=new THREE.Scene();camera=new THREE.OrthographicCamera();gl=new THREE.WebGLRenderer({canvas,antialias:true});gl.setPixelRatio(devicePixelRatio);gl.setClearColor('#122536');const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(mapping.length*3),3));geometry.setAttribute('uv',new THREE.BufferAttribute(uv,2));geometry.setIndex(new THREE.BufferAttribute(indices,1));const material=new THREE.RawShaderMaterial({side:THREE.DoubleSide,uniforms:{atlas:{value:await texture('body_texture_rgba.png')},neutral:{value:false}},vertexShader:'precision highp float;attribute vec3 position;attribute vec2 uv;uniform mat4 projectionMatrix,modelViewMatrix;varying vec2 coords;void main(){coords=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'precision highp float;uniform sampler2D atlas;uniform bool neutral;varying vec2 coords;void main(){vec4 t=texture2D(atlas,coords);gl_FragColor=vec4(neutral?vec3(.32,.40,.45):mix(vec3(.32,.40,.45),t.rgb,t.a),1.);}'});mesh=new THREE.Mesh(geometry,material);mesh.frustumCulled=false;scene.add(mesh);ready=true;$('seek').max=meta.frames-1;$('report').textContent=`${report.clips} 段视频 · 表面候选覆盖 ${(report.combined_face_coverage*100).toFixed(1)}% · 单视频 ${(report.single_clip_face_coverage*100).toFixed(1)}% · 待复核`;draw();tick()})().catch(e=>{$('status').textContent=e.message;$('play').disabled=true});
</script></html>
