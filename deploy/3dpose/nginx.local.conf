server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    client_max_body_size 1g;
    location = /healthz { default_type text/plain; return 200 'ok'; }
    location = / { return 302 /import.html; }
    location /api/ {
        proxy_pass http://host.docker.internal:18768;
        proxy_set_header Host 127.0.0.1:18768;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /default/ {
        proxy_pass http://host.docker.internal:18768;
        proxy_set_header Host 127.0.0.1:18768;
        proxy_read_timeout 60s;
    }
    location ~ "^/datasets/([a-f0-9]{32})/(source\.mp4|result/[A-Za-z0-9_.-]+\.(html|json|bin|mp4|png))$" {
        alias /data/$1/$2;
        add_header Cache-Control 'no-cache';
    }
    location /datasets/ { return 404; }
    location / { try_files $uri =404; add_header Cache-Control 'no-cache'; }
}
