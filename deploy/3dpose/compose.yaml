services:
  viewer:
    build:
      context: .
      args:
        VIEWER_BASE_IMAGE: ${VIEWER_BASE_IMAGE:-nginx:1.27-alpine}
    image: tennis-3dpose-viewer:hehaa-3dpose
    container_name: tennis-3dpose-viewer
    restart: unless-stopped
    ports:
      - "127.0.0.1:18766:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
